<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>曙光问道 · V6.7</title><style>html,body{margin:0;width:100%;height:100%;display:grid;place-items:center;background:#dceae1;color:#31594f;font-family:system-ui,"Microsoft YaHei",sans-serif}.boot{letter-spacing:.16em}</style></head><body><div class="boot">六道共鸣展开中…</div><script>(async()=>{try{const files=['../runtime/v6.7/gzip-01.b64','../runtime/v6.7/gzip-02.b64','../runtime/v6.7/gzip-03.b64','../runtime/v6.7/gzip-04.b64','../runtime/v6.7/gzip-05.b64','../runtime/v6.7/gzip-06.b64'];const b64=(await Promise.all(files.map(f=>fetch(f).then(r=>{if(!r.ok)throw new Error(f+' '+r.status);return r.text()})))).join('');const bin=atob(b64);const bytes=Uint8Array.from(bin,c=>c.charCodeAt(0));if(!('DecompressionStream'in window))throw new Error('浏览器不支持 DecompressionStream');const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));const html=await new Response(stream).text();document.open();document.write(html);document.close()}catch(e){document.body.innerHTML='<pre style="padding:24px;white-space:pre-wrap">V6.7 加载失败：'+String(e)+'</pre>'}})();</script></body></html>
